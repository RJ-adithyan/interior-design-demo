<div class="surface-dark" data-work>
  <section class="fl-page-intro container" aria-labelledby="work-title">
    <h1 id="work-title" class="display" data-reveal="text">$page_title</h1>
    <p class="page-lead">$page_lead</p>
    <p class="eyebrow">$sample_label</p>
  </section>
  <section id="projects" class="container section" aria-label="Selected concepts">
    <nav class="fl-work-filters" aria-label="Project category">
      <a href="work.html?category=all#projects" data-work-category-filter="all" aria-current="true">All projects</a>
      $category_filters
    </nav>
    <div class="fl-work-grid">$project_cards</div>
  </section>
</div>
