<article class="surface-dark">
  <header class="fl-project-intro">
    <div class="fl-project-backdrop" aria-hidden="true">$project_hero</div>
    <div class="container">
      <div class="fl-project-heading">
        <h1 class="display" data-reveal="text">$name</h1>
        <p class="body-large">$tagline</p>
      </div>
      <div class="fl-project-summary">
        <p>$intro</p>
        <dl>
          <div><dt>Concept</dt><dd>$eyebrow</dd></div>
          <div><dt>Photography</dt><dd><a href="$source_url">$photographer <span aria-hidden="true">↗</span></a></dd></div>
          <div><dt>About this study</dt><dd>Fictional concept. Reference photography.</dd></div>
        </dl>
      </div>
    </div>
  </header>
  <div class="container fl-project-gallery">
    <figure class="media-frame media-wide" data-reveal="image">$project_hero</figure>
    <section class="fl-project-story" aria-labelledby="story-title">
      <h2 id="story-title" class="heading" data-reveal="text">$story_title</h2>
      <p>$story</p>
    </section>
    <figure>
      <div class="media-frame media-wide" data-reveal="image">$project_detail_image</div>
      <figcaption>$detail_caption <a href="$detail_source_url">Photography: $photographer <span aria-hidden="true">↗</span></a></figcaption>
    </figure>
    <section class="fl-project-story" aria-labelledby="detail-title">
      <h2 id="detail-title" class="heading" data-reveal="text">$detail_title</h2>
      <p>$detail</p>
      <a class="text-link" href="work.html">All concepts <span aria-hidden="true">↗</span></a>
    </section>
  </div>
</article>
<section class="section surface-dark fl-next-project" aria-labelledby="next-title">
  <div class="container">
    <h2 id="next-title" class="heading">Next concept</h2>
    <a class="project-card" href="$next_href">
      <div class="media-frame media-wide" data-reveal="image">$next_image</div>
      <div class="project-card__caption"><h3>$next_name <span aria-hidden="true">↗</span></h3></div>
    </a>
  </div>
</section>
