<section class="fl-contact surface-forest" aria-labelledby="contact-title">
  <div class="container fl-contact-layout">
    <div class="fl-contact-copy">
      <h1 id="contact-title" class="display" data-reveal="text">$page_title</h1>
      <p class="page-lead">$page_lead</p>
    </div>
    <div class="fl-contact-panel">
      <h2 class="heading">Get in touch</h2>
      <p>$contact_prompt</p>
      <a class="button-link" href="$contact_whatsapp_url" aria-describedby="contact-disclosure">$contact_action_label <span aria-hidden="true">↗</span></a>
      <p class="fl-contact-phone">$contact_phone_display</p>
      <p class="fl-contact-name">$contact_name · Website creator</p>
      <p id="contact-disclosure" class="fl-contact-note">$contact_note</p>
    </div>
    <div class="fl-contact-photo media-frame media-wide" data-reveal="image">$apartment_image</div>
  </div>
</section>
