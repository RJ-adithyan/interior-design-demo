<section class="fl-image-hero" aria-labelledby="process-title">
  <div class="fl-image-hero-media">$villa_image</div>
  <div class="container">
    <h1 id="process-title" class="display" data-reveal="text">$page_title</h1>
    <p class="page-lead">$page_lead</p>
  </div>
</section>
<section class="section surface-dark" aria-labelledby="approach-title">
  <div class="container">
    <div class="fl-services-intro">
      <h2 id="approach-title" class="heading" data-reveal="text">$closing_title</h2>
      <p>$closing_body</p>
    </div>
    <div class="fl-process-list">
      <article class="fl-process-step">
        <span class="fl-step-number" aria-hidden="true">01</span>
        <h3 class="heading" data-reveal="text">$step_one_title</h3>
        <p>$step_one_body</p>
      </article>
      <article class="fl-process-step">
        <span class="fl-step-number" aria-hidden="true">02</span>
        <h3 class="heading" data-reveal="text">$step_two_title</h3>
        <p>$step_two_body</p>
      </article>
      <article class="fl-process-step">
        <span class="fl-step-number" aria-hidden="true">03</span>
        <h3 class="heading" data-reveal="text">$step_three_title</h3>
        <p>$step_three_body</p>
      </article>
    </div>
    <div class="fl-centered-closing"><a class="button-link" href="work.html">Explore work <span aria-hidden="true">↗</span></a></div>
  </div>
</section>
